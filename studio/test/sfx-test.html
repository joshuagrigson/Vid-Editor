<!doctype html>
<html><head><meta charset="utf-8"><title>FrightCut SFX test</title>
<style>body{background:#111;color:#ddd;font:13px monospace;padding:12px}.fail{color:#f66}.pass{color:#6f6}img{display:block;margin:6px 0;border:1px solid #333}</style>
</head><body>
<h3>FrightCut sfx.js test</h3>
<pre id="log"></pre>
<div id="specs"></div>
<script type="module">
import { SFX, SFX_CATEGORIES, BEDS, renderSfx, renderBed } from '../js/sfx.js';
const logEl = document.getElementById('log');
const lines = [];
const log = (s, cls) => { lines.push(s); const sp = document.createElement('span'); if (cls) sp.className = cls; sp.textContent = s + '\n'; logEl.appendChild(sp); };

function stats(buf) {
  let peak = 0, sum = 0, nan = 0, n = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const v = d[i]; if (!Number.isFinite(v)) { nan++; continue; } const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; n++; }
  }
  return { peak, rms: Math.sqrt(sum / Math.max(1, n)), nan };
}
function seam(buf) {
  let worst = { jump: 0, allowed: 0, dJump: 0, dAllowed: 0, ok: true };
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c), N = d.length;
    const at = (i) => d[(i + N) % N];
    // local step size around the seam (excluding the seam itself)
    let maxStep = 0, maxCurv = 0;
    for (let i = -400; i < 400; i++) {
      if (i === -1 || i === 0 || i === -2) continue;
      maxStep = Math.max(maxStep, Math.abs(at(i + 1) - at(i)));
      maxCurv = Math.max(maxCurv, Math.abs(at(i + 1) - 2 * at(i) + at(i - 1)));
    }
    const jump = Math.abs(d[0] - d[N - 1]);
    const dJump = Math.abs((d[1] - d[0]) - (d[N - 1] - d[N - 2]));
    const allowed = maxStep * 2 + 1e-4, dAllowed = maxCurv * 2 + 1e-4; // seam must look like any other sample nearby
    const ok = jump <= allowed && dJump <= dAllowed;
    if (!ok || jump > worst.jump) worst = { jump, allowed, dJump, dAllowed, ok: ok && worst.ok };
  }
  return worst;
}

// ---- spectrogram + wav helpers for manual inspection
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let j = 0; j < len / 2; j++) {
      const ur = re[i + j], ui = im[i + j], vr = re[i + j + len / 2] * cr - im[i + j + len / 2] * ci, vi = re[i + j + len / 2] * ci + im[i + j + len / 2] * cr;
      re[i + j] = ur + vr; im[i + j] = ui + vi; re[i + j + len / 2] = ur - vr; im[i + j + len / 2] = ui - vi;
      const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } }
  }
}
function spectrogram(buf, title) {
  const d = buf.getChannelData(0), sr = buf.sampleRate, N = 2048, hop = 256, fmax = 12000;
  const cols = Math.floor((d.length - N) / hop), W = Math.min(900, cols), H = 300, cv = document.createElement('canvas');
  cv.width = W + 60; cv.height = H + 40; const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  const img = g.createImageData(W, H), bins = Math.floor(fmax / sr * N), mags = [];
  let top = -999;
  for (let x = 0; x < W; x++) {
    const off = Math.floor(x * cols / W) * hop, re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < N; i++) re[i] = d[off + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / N));
    fft(re, im); const col = new Float32Array(bins + 1);
    for (let b = 0; b <= bins; b++) { col[b] = 20 * Math.log10(Math.hypot(re[b], im[b]) + 1e-9); top = Math.max(top, col[b]); }
    mags.push(col);
  }
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      const b = Math.floor((1 - y / H) * bins), v = Math.max(0, Math.min(1, (mags[x][b] - top + 75) / 75));
      const p = (y * W + x) * 4;
      img.data[p] = 255 * Math.min(1, v * 2); img.data[p + 1] = 255 * Math.max(0, v * 2 - 1); img.data[p + 2] = 255 * Math.max(0, 0.5 - v) * v * 4; img.data[p + 3] = 255;
    }
  }
  g.putImageData(img, 50, 10); g.fillStyle = '#ccc'; g.font = '11px monospace';
  for (let f = 0; f <= fmax; f += 2000) g.fillText((f / 1000) + 'k', 4, 10 + H - (f / fmax) * H + 4);
  g.fillText(`${title}  ${buf.duration.toFixed(2)}s  0..12kHz, 75 dB range`, 60, H + 30);
  return cv;
}
function wav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const chs = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44; for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { v.setInt16(o, Math.max(-32768, Math.min(32767, Math.round(chs[c][i] * 32767))), true); o += 2; }
  let s = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

(async () => {
  let fails = 0;
  const check = (ok, msg) => { if (!ok) { fails++; log('FAIL ' + msg, 'fail'); } return ok; };
  check(SFX.length >= 45, `SFX count ${SFX.length} >= 45`);
  check(BEDS.length >= 8, `BED count ${BEDS.length} >= 8`);
  const cats = new Set(SFX_CATEGORIES.map((c) => c.id));
  for (const s of SFX) check(cats.has(s.cat), `${s.id} has known category`);
  check(new Set(SFX.map((s) => s.id)).size === SFX.length, 'SFX ids unique');

  const t0 = performance.now(); const timings = {};
  for (const s of SFX) {
    const a = performance.now(); let buf;
    try { buf = await renderSfx(s.id); } catch (e) { check(false, `${s.id} threw ${e}`); continue; }
    timings[s.id] = performance.now() - a;
    const st = stats(buf), durOk = Math.abs(buf.duration - s.dur) <= s.dur * 0.1;
    const ok = check(buf.numberOfChannels === 2, `${s.id} channels ${buf.numberOfChannels}`)
      & check(durOk, `${s.id} duration ${buf.duration} vs ${s.dur}`)
      & check(st.peak >= 0.5 && st.peak <= 1.0, `${s.id} peak ${st.peak.toFixed(3)}`)
      & check(st.nan === 0, `${s.id} NaN ${st.nan}`)
      & check(st.rms > 0.005, `${s.id} rms ${st.rms.toFixed(4)}`);
    log(`${ok ? 'ok  ' : 'BAD '} sfx ${s.id.padEnd(18)} ${buf.duration.toFixed(2)}s peak ${st.peak.toFixed(3)} rms ${st.rms.toFixed(3)} ${timings[s.id].toFixed(0)}ms`, ok ? 'pass' : 'fail');
  }
  const sfxMs = performance.now() - t0;
  const c0 = performance.now(); await renderSfx('scream_f'); const cachedMs = performance.now() - c0;
  check(cachedMs < 5, `cache hit fast (${cachedMs.toFixed(2)}ms)`);
  const s2 = await renderSfx('scream_f', { seed: 2 }), s1 = await renderSfx('scream_f');
  check(s1 !== s2 && s1.getChannelData(0)[24000] !== s2.getChannelData(0)[24000], 'different seeds differ');

  const b0 = performance.now();
  for (const b of BEDS) {
    const a = performance.now(); let buf;
    try { buf = await renderBed(b.id, { seconds: 30 }); } catch (e) { check(false, `${b.id} threw ${e}`); continue; }
    const ms = performance.now() - a, st = stats(buf), sm = seam(buf);
    const ok = check(buf.numberOfChannels === 2, `${b.id} channels`)
      & check(Math.abs(buf.duration - 30) <= 3, `${b.id} duration ${buf.duration}`)
      & check(st.peak >= 0.5 && st.peak <= 1.0, `${b.id} peak ${st.peak.toFixed(3)}`)
      & check(st.nan === 0, `${b.id} NaN`) & check(st.rms > 0.003, `${b.id} rms ${st.rms.toFixed(4)}`)
      & check(sm.ok, `${b.id} loop seam jump ${sm.jump.toExponential(2)} (allowed ${sm.allowed.toExponential(2)}) dJump ${sm.dJump.toExponential(2)} (allowed ${sm.dAllowed.toExponential(2)})`);
    log(`${ok ? 'ok  ' : 'BAD '} bed ${b.id.padEnd(16)} ${buf.duration.toFixed(2)}s peak ${st.peak.toFixed(3)} rms ${st.rms.toFixed(3)} seam ${sm.jump.toExponential(1)}/${sm.allowed.toExponential(1)} ${ms.toFixed(0)}ms`, ok ? 'pass' : 'fail');
  }
  const bedMs = performance.now() - b0;
  // a short bed loop too
  const short = await renderBed('dread', { seconds: 8 }); check(Math.abs(short.duration - 8) < 0.01 && seam(short).ok, 'short 8s bed seamless');

  log(`\nTIMING all ${SFX.length} SFX: ${(sfxMs / 1000).toFixed(2)}s, all ${BEDS.length} beds (30s): ${(bedMs / 1000).toFixed(2)}s`);
  const slow = Object.entries(timings).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `${k} ${v.toFixed(0)}ms`).join(', ');
  log(`slowest SFX: ${slow}`);

  const exports = {};
  for (const id of ['scream_f', 'door_creak', 'jumpscare']) {
    const buf = await renderSfx(id); const cv = spectrogram(buf, id);
    document.getElementById('specs').appendChild(cv);
    exports[id] = { wav: wav(buf), png: cv.toDataURL('image/png') };
  }
  log(fails ? `RESULT: FAIL (${fails} failures)` : 'RESULT: PASS', fails ? 'fail' : 'pass');
  window.__report = { fails, lines, exports };
  window.__done = true;
})().catch((e) => { log('FATAL ' + e.stack, 'fail'); window.__report = { fails: 1, lines, exports: {} }; window.__done = true; });
</script>
</body></html>
