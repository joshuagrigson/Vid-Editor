<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FrightCut effects test</title>
<style>
  body { background:#111; color:#ddd; font:13px/1.4 system-ui, sans-serif; margin:16px; }
  .fail { color:#f66; } .ok { color:#6c6; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<h1>FrightCut effects test</h1>
<p>Open with <code>?auto=1</code> to run all checks in the browser. The Playwright runner
(<code>run-effects-test.py</code>) calls <code>window.FXTest</code> directly.</p>
<pre id="log"></pre>
<script type="module">
import * as FX from '../js/effects.js';

const VS = `#version 300 es
in vec2 a_pos; out vec2 v_uv;
void main(){ v_uv=a_pos*.5+.5; gl_Position=vec4(a_pos,0.,1.); }`;
const PASS = `void main(){ outColor=vec4(texture(u_tex,v_uv).rgb,1.); }`;

// ---------- procedural test image ----------
function drawTestImage(ctx, W, H) {
  const m = Math.min(W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a3550'); g.addColorStop(0.55, '#6b6f78'); g.addColorStop(0.56, '#3b2f28'); g.addColorStop(1, '#120d0a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // door
  ctx.fillStyle = '#4a3020'; ctx.fillRect(W * 0.62, H * 0.22, m * 0.22, H * 0.34);
  ctx.fillStyle = '#d9b44a'; ctx.beginPath(); ctx.arc(W * 0.62 + m * 0.19, H * 0.4, m * 0.012, 0, 7); ctx.fill();
  // lamp (bright)
  const lg = ctx.createRadialGradient(W * 0.2, H * 0.18, 0, W * 0.2, H * 0.18, m * 0.12);
  lg.addColorStop(0, '#fffbe8'); lg.addColorStop(0.3, '#ffe28a'); lg.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  // red object
  ctx.fillStyle = '#c0141a'; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.7, m * 0.07, 0, 7); ctx.fill();
  // green / blue blocks
  ctx.fillStyle = '#2e8b3a'; ctx.fillRect(W * 0.05, H * 0.75, m * 0.18, m * 0.12);
  ctx.fillStyle = '#2050c0'; ctx.fillRect(W * 0.3, H * 0.8, m * 0.14, m * 0.14);
  // face-like blob
  const fx = W * 0.42, fy = H * 0.45, fr = m * 0.13;
  const sg = ctx.createRadialGradient(fx - fr * 0.3, fy - fr * 0.3, fr * 0.1, fx, fy, fr);
  sg.addColorStop(0, '#f2c8a8'); sg.addColorStop(1, '#a8705a');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(fx, fy, fr * 0.8, fr, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1010';
  ctx.beginPath(); ctx.ellipse(fx - fr * 0.3, fy - fr * 0.15, fr * 0.12, fr * 0.08, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(fx + fr * 0.3, fy - fr * 0.15, fr * 0.12, fr * 0.08, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(fx - fr * 0.28, fy - fr * 0.17, fr * 0.03, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + fr * 0.32, fy - fr * 0.17, fr * 0.03, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a1a1a'; ctx.beginPath(); ctx.ellipse(fx, fy + fr * 0.45, fr * 0.3, fr * 0.1, 0, 0, 7); ctx.fill();
  // body
  ctx.fillStyle = '#30343c'; ctx.beginPath(); ctx.ellipse(fx, fy + fr * 2.2, fr * 1.3, fr * 1.1, 0, Math.PI, 0); ctx.fill();
  // text
  ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(m * 0.08)}px sans-serif`;
  ctx.fillText('FRIGHT', W * 0.06, H * 0.08 + m * 0.06);
  // thin lines / checker for detail
  ctx.strokeStyle = '#999'; ctx.lineWidth = Math.max(1, m / 360);
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(W * 0.05 + i * m * 0.02, H * 0.62); ctx.lineTo(W * 0.05 + i * m * 0.02, H * 0.7); ctx.stroke(); }
}

async function videoFrame(W, H, which, t) {
  const v = document.createElement('video');
  v.muted = true; v.src = which; v.crossOrigin = 'anonymous';
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('video load failed')); });
  v.currentTime = Math.min(t, (v.duration || 2) - 0.1);
  await new Promise((res) => { v.onseeked = res; setTimeout(res, 3000); });
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const s = Math.max(W / v.videoWidth, H / v.videoHeight);
  const w = v.videoWidth * s, h = v.videoHeight * s;
  ctx.drawImage(v, (W - w) / 2, (H - h) / 2, w, h);
  return c;
}

// ---------- GL harness ----------
class Harness {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.canvas = document.createElement('canvas'); this.canvas.width = W; this.canvas.height = H;
    const gl = this.gl = this.canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
    if (!gl) throw new Error('no webgl2');
    this.floatOK = !!gl.getExtension('EXT_color_buffer_float');
    this.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    this.cache = new Map();
    this.fbos = [this.makeTarget(), this.makeTarget(), this.makeTarget()];
  }
  makeTex(src) {
    const gl = this.gl; const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    if (src) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  makeTarget() {
    const gl = this.gl; const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (this.floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.W, this.H, 0, gl.RGBA, gl.FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, this.W, this.H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const filt = this.floatOK ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  }
  program(body) {
    if (this.cache.has(body)) return this.cache.get(body);
    const gl = this.gl;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FX.buildFragment(body));
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, 'a_pos'); gl.linkProgram(p);
    let res;
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      res = { error: (gl.getShaderInfoLog(fs) || '') + '\n' + (gl.getProgramInfoLog(p) || '') };
    } else {
      const u = {};
      for (const n of ['u_tex', 'u_prev', 'u_res', 'u_time', 'u_local', 'u_dur', 'u_amt', 'u_p', 'u_seed', 'u_prog', 'u_side']) u[n] = gl.getUniformLocation(p, n);
      res = { p, u };
    }
    this.cache.set(body, res);
    return res;
  }
  // render body with input texture into target index; returns target
  render(body, inTex, prevTex, U, target) {
    const gl = this.gl; const pr = this.program(body);
    if (pr.error) throw new Error(pr.error);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, this.W, this.H);
    gl.useProgram(pr.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, inTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prevTex);
    const u = pr.u;
    gl.uniform1i(u.u_tex, 0); gl.uniform1i(u.u_prev, 1);
    gl.uniform2f(u.u_res, this.W, this.H);
    gl.uniform1f(u.u_time, U.time ?? 1.3); gl.uniform1f(u.u_local, U.local ?? U.time ?? 1.3);
    gl.uniform1f(u.u_dur, U.dur ?? 0); gl.uniform1f(u.u_amt, U.amt ?? 1);
    gl.uniform4fv(u.u_p, U.p ?? [0, 0, 0, 0]); gl.uniform1f(u.u_seed, U.seed ?? 0.37);
    gl.uniform1f(u.u_prog, U.prog ?? 0); gl.uniform1f(u.u_side, U.side ?? 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return target;
  }
  read(target) {
    const gl = this.gl; gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
    if (this.floatOK) { const a = new Float32Array(this.W * this.H * 4); gl.readPixels(0, 0, this.W, this.H, gl.RGBA, gl.FLOAT, a); return a; }
    const b = new Uint8Array(this.W * this.H * 4); gl.readPixels(0, 0, this.W, this.H, gl.RGBA, gl.UNSIGNED_BYTE, b);
    return Float32Array.from(b, (x) => x / 255);
  }
}

function stats(a, ref) {
  let nan = 0, maxD = 0, sumD = 0, maxV = 0, sumL = 0; const n = a.length / 4;
  for (let i = 0; i < a.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const v = a[i + c];
      if (!Number.isFinite(v)) { nan++; continue; }
      if (v > maxV) maxV = v;
      if (ref) { const d = Math.abs(Math.min(1, Math.max(0, v)) - ref[i + c]); if (d > maxD) maxD = d; sumD += d; }
    }
    sumL += a[i] * 0.2126 + a[i + 1] * 0.7152 + a[i + 2] * 0.0722;
  }
  return { nan, maxD, meanD: sumD / (n * 3), maxV, meanL: sumL / n };
}

async function setup(W, H, source) {
  const h = new Harness(W, H);
  let img;
  if (source && source !== 'proc') img = await videoFrame(W, H, source, 1.0);
  else { img = document.createElement('canvas'); img.width = W; img.height = H; drawTestImage(img.getContext('2d'), W, H); }
  const prevC = document.createElement('canvas'); prevC.width = W; prevC.height = H;
  const pctx = prevC.getContext('2d'); pctx.drawImage(img, Math.round(Math.min(W, H) * 0.02), Math.round(Math.min(W, H) * 0.01));
  h.srcTex = h.makeTex(img); h.prevTex = h.makeTex(prevC);
  h.ref = h.read(h.render(PASS, h.srcTex, h.prevTex, {}, h.fbos[2]));
  return h;
}

const TIMES = [0.03, 0.1, 0.45, 1.3, 2.2, 3.7];
const MUST_BE_DARK_OK = new Set(['blackout']);
const TOL = 2.5 / 255;

async function runAll(W, H) {
  const h = await setup(W, H, 'proc');
  const out = { W, H, floatOK: h.floatOK, effects: [], transitions: [], looks: [], failures: [] };
  const fail = (kind, id, msg) => out.failures.push(`${kind} ${id} @${W}x${H}: ${msg}`);
  for (const def of FX.EFFECTS) {
    const r = { id: def.id };
    const pr = h.program(def.glsl);
    if (pr.error) { fail('effect', def.id, 'COMPILE ' + pr.error); out.effects.push(r); continue; }
    const vals = FX.defaultParams(def);
    const pk = FX.packParams(def, vals);
    // identity
    let idMax = 0;
    for (const t of [0.4, 1.3]) {
      const s = stats(h.read(h.render(def.glsl, h.srcTex, h.prevTex, { time: t, amt: 0, p: pk.p }, h.fbos[0])), h.ref);
      idMax = Math.max(idMax, s.maxD); if (s.nan) fail('effect', def.id, 'NaN at amt=0');
    }
    if (idMax > TOL) fail('effect', def.id, `amt=0 not identity (max diff ${(idMax * 255).toFixed(1)}/255)`);
    // default
    let best = 0, bestMax = 0, bestT = 1.3, anyBright = false, nan = 0;
    for (const dur of [0, 1.5]) for (const t of TIMES) {
      const s = stats(h.read(h.render(def.glsl, h.srcTex, h.prevTex, { time: t, local: t, dur, amt: pk.amt, p: pk.p }, h.fbos[0])), h.ref);
      nan += s.nan; if (s.maxV > 0.03) anyBright = true;
      if (dur === 0 && s.meanD > best) { best = s.meanD; bestT = t; }
      bestMax = Math.max(bestMax, s.maxD);
    }
    if (nan) fail('effect', def.id, `${nan} NaN values`);
    if (!anyBright && !MUST_BE_DARK_OK.has(def.id)) fail('effect', def.id, 'all black');
    // small localized overlays (reel cue) may change few pixels: accept a strong local change too
    if (best < 0.002 && bestMax < 0.25) fail('effect', def.id, `no visible change at default (mean diff ${best.toFixed(4)})`);
    Object.assign(r, { idMax: +(idMax * 255).toFixed(2), meanDiff: +best.toFixed(4), bestT });
    out.effects.push(r);
  }
  for (const def of FX.TRANSITIONS) {
    const r = { id: def.id };
    const pr = h.program(def.glsl);
    if (pr.error) { fail('transition', def.id, 'COMPILE ' + pr.error); out.transitions.push(r); continue; }
    for (const [prog, side] of [[0, 0], [1, 1], [0.25, 0], [0.75, 1], [0.5, 0], [0.5, 1], [0.4, 0], [0.6, 1]]) {
      const s = stats(h.read(h.render(def.glsl, h.srcTex, h.prevTex, { time: 1.3 + prog, prog, side, amt: 1 }, h.fbos[0])), h.ref);
      if (s.nan) fail('transition', def.id, `NaN at prog ${prog}`);
      if ((prog === 0 || prog === 1) && s.maxD > TOL) fail('transition', def.id, `not identity at prog ${prog} (${(s.maxD * 255).toFixed(1)}/255)`);
      if ((prog === 0.25 || prog === 0.75) && s.meanD < 0.003) fail('transition', def.id, `no change at prog ${prog}`);
      r['d' + prog + '_' + side] = +s.meanD.toFixed(3);
    }
    out.transitions.push(r);
  }
  for (const look of FX.LOOKS) {
    const r = { id: look.id };
    try {
      for (const t of [0.45, 1.3, 2.2]) {
        let inTex = h.srcTex, k = 0;
        for (const e of look.effects) {
          const def = FX.effectById(e.type);
          if (!def) throw new Error('unknown effect ' + e.type);
          const pk = FX.packParams(def, { ...FX.defaultParams(def), ...e.params });
          const tgt = h.fbos[k % 2];
          h.render(def.glsl, inTex, h.prevTex, { time: t, local: t, amt: pk.amt, p: pk.p }, tgt);
          inTex = tgt.tex; k++;
        }
        const s = stats(h.read(h.fbos[(k - 1) % 2]), h.ref);
        if (s.nan) fail('look', look.id, 'NaN');
        if (s.maxV < 0.03) fail('look', look.id, 'all black at t=' + t);
        if (s.meanD < 0.003) fail('look', look.id, 'no change');
        r['t' + t] = +s.meanD.toFixed(3);
      }
    } catch (err) { fail('look', look.id, String(err.message || err)); }
    out.looks.push(r);
  }
  return out;
}

// ---------- contact sheet ----------
async function sheet(opts) {
  const { W, H, source = 'proc', kind = 'effects', cols = 8, thumb = 0.5, ids = null, title = '' } = opts;
  const h = await setup(W, H, source);
  const tw = Math.round(W * thumb), th = Math.round(H * thumb), lab = 18;
  let items = [];
  if (kind === 'effects') items = FX.EFFECTS.filter((d) => !ids || ids.includes(d.id)).map((d) => ({ name: `${d.name} [${d.cat}]`, d, type: 'fx' }));
  if (kind === 'transitions') for (const d of FX.TRANSITIONS) for (const prog of [0.25, 0.42, 0.58, 0.75]) items.push({ name: `${d.name} ${prog}`, d, prog, type: 'tr' });
  if (kind === 'looks') items = FX.LOOKS.map((d) => ({ name: d.name, d, type: 'look' }));
  items.unshift({ name: 'ORIGINAL', type: 'orig' });
  const rows = Math.ceil(items.length / cols);
  const sc = document.createElement('canvas'); sc.width = cols * tw; sc.height = rows * (th + lab) + (title ? 24 : 0);
  const ctx = sc.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, sc.width, sc.height);
  const y0 = title ? 24 : 0;
  if (title) { ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(title, 6, 18); }
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tctx = tmp.getContext('2d');
  const t0 = 1.3;
  for (let i = 0; i < items.length; i++) {
    const it = items[i]; let data;
    if (it.type === 'orig') data = h.ref;
    else if (it.type === 'fx') {
      const pk = FX.packParams(it.d, FX.defaultParams(it.d));
      let t = t0;
      // one-shot / intermittent effects: pick the most visible of a few times so the sheet shows them
      let best = -1;
      for (const tt of [1.3, 0.1, 0.45, 0.03, 2.2]) {
        const s = stats(h.read(h.render(it.d.glsl, h.srcTex, h.prevTex, { time: tt, local: tt, amt: pk.amt, p: pk.p }, h.fbos[0])), h.ref);
        if (tt === 1.3 && s.meanD > 0.02) { best = s.meanD; t = tt; break; }
        if (s.meanD > best) { best = s.meanD; t = tt; }
      }
      data = h.read(h.render(it.d.glsl, h.srcTex, h.prevTex, { time: t, local: t, amt: pk.amt, p: pk.p }, h.fbos[0]));
      it.name += ` t${t}`;
    } else if (it.type === 'tr') {
      data = h.read(h.render(it.d.glsl, h.srcTex, h.prevTex, { time: 1.3, prog: it.prog, side: it.prog < 0.5 ? 0 : 1 }, h.fbos[0]));
    } else {
      let inTex = h.srcTex, k = 0;
      for (const e of it.d.effects) {
        const def = FX.effectById(e.type);
        const pk = FX.packParams(def, { ...FX.defaultParams(def), ...e.params });
        h.render(def.glsl, inTex, h.prevTex, { time: t0, local: t0, amt: pk.amt, p: pk.p }, h.fbos[k % 2]);
        inTex = h.fbos[k % 2].tex; k++;
      }
      data = h.read(h.fbos[(k - 1) % 2]);
    }
    const id = tctx.createImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const si = ((H - 1 - y) * W + x) * 4, di = (y * W + x) * 4;
      for (let c = 0; c < 3; c++) id.data[di + c] = Math.max(0, Math.min(255, Math.round(data[si + c] * 255)));
      id.data[di + 3] = 255;
    }
    tctx.putImageData(id, 0, 0);
    const cx = (i % cols) * tw, cy = y0 + Math.floor(i / cols) * (th + lab);
    ctx.drawImage(tmp, cx, cy, tw, th);
    ctx.fillStyle = '#ddd'; ctx.font = '12px sans-serif'; ctx.fillText(it.name, cx + 3, cy + th + 13, tw - 6);
  }
  return sc.toDataURL('image/png');
}

// ---------- timing ----------
async function timeAll(W, H, reps = 2) {
  const h = await setup(W, H, 'proc');
  const gl = h.gl; const px = new Float32Array(4); const res = [];
  const sync = () => { gl.bindFramebuffer(gl.FRAMEBUFFER, h.fbos[0].fb); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); };
  for (const d of [...FX.EFFECTS, ...FX.TRANSITIONS]) {
    const pk = d.params ? FX.packParams(d, FX.defaultParams(d)) : { amt: 1, p: [0, 0, 0, 0] };
    h.render(d.glsl, h.srcTex, h.prevTex, { amt: pk.amt, p: pk.p, prog: 0.3 }, h.fbos[0]); sync();
    const t0 = performance.now();
    for (let i = 0; i < reps; i++) h.render(d.glsl, h.srcTex, h.prevTex, { amt: pk.amt, p: pk.p, time: 1 + i * 0.03, prog: 0.3 }, h.fbos[0]);
    sync();
    res.push({ id: d.id, ms: +((performance.now() - t0) / reps).toFixed(1) });
  }
  const pass = (() => { const t0 = performance.now(); for (let i = 0; i < reps; i++) h.render(PASS, h.srcTex, h.prevTex, {}, h.fbos[0]); sync(); return (performance.now() - t0) / reps; })();
  return { W, H, passthroughMs: +pass.toFixed(1), res };
}

window.FXTest = { runAll, sheet, timeAll, FX };
window.FXTestReady = true;

if (new URLSearchParams(location.search).get('auto')) {
  const log = document.getElementById('log');
  for (const [W, H] of [[360, 640], [640, 360]]) {
    const r = await runAll(W, H);
    log.innerHTML += `<div class="${r.failures.length ? 'fail' : 'ok'}">${W}x${H}: ${r.effects.length} effects, ${r.transitions.length} transitions, ${r.looks.length} looks — ${r.failures.length} failures</div>`;
    for (const f of r.failures) log.innerHTML += `<div class="fail">${f.replace(/</g, '&lt;')}</div>`;
  }
  const img = new Image(); img.src = await sheet({ W: 360, H: 640, cols: 10, thumb: 0.4 }); document.body.appendChild(img);
}
</script>
</body>
</html>
